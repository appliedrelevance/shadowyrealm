<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #board {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div data-hf-id="hf-58yv" id="root" data-composition-id="race-board" data-width="1920" data-height="1080">
    <div data-hf-id="hf-1lyt" id="board" class="clip" data-start="0" data-duration="300" data-track-index="0">
      <div data-hf-id="hf-rjzp" id="board-year" class="panel-year">3500 BCE</div>
      <div data-hf-id="hf-vrgm" id="board-era" class="panel-era"></div>
      <div data-hf-id="hf-secu" id="board-caption" class="panel-caption">Most influential that year</div>
      <div data-hf-id="hf-xamh" id="board-rank-1" class="board-rank" style="top: 380px">1</div>
      <div data-hf-id="hf-mmtf" id="board-rank-2" class="board-rank" style="top: 472px">2</div>
      <div data-hf-id="hf-yb9t" id="board-rank-3" class="board-rank" style="top: 564px">3</div>
      <div data-hf-id="hf-ly1n" id="board-rank-4" class="board-rank" style="top: 656px">4</div>
      <div data-hf-id="hf-ebxd" id="board-rank-5" class="board-rank" style="top: 748px">5</div>
      <div data-hf-id="hf-hybh" id="board-rows" class="board-rows" data-layout-allow-overlap data-layout-allow-occlusion></div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(async () => {
      const River = window.River;
      const { FILMS, ERAS, axis, clock, yearAt, ease, ramp, clamp01 } = River;
      const realm = window.REALM;
      const film = FILMS.race;
      const ax = axis(realm);
      const { frontAt, timeAtFront } = clock(film);
      const race = River.board(realm, film);
      const kit = window.RaceKit(realm);
      const SLOTS = race.slots;

      // A row's place is its rank averaged over the last 0.35 s, so an overtake is a quick glide
      // rather than a jump; whether it is on the board at all is its rank averaged over the last
      // second, so a brief visit never flickers on. Both are functions of time alone. The bars
      // carry the ranking alone: the curve's level is influence per century, a unit the site never
      // shows. Totals, in the site's own unit, come with all time (race-tally).
      const SAMPLE_STEP = 0.05;
      const PLACE_SAMPLES = 7; // 0.35 s
      const STAY_SAMPLES = 20; // 1.0 s

      // A row for every entity that is ever in the top six, built before the first frame.
      const rowsEl = document.getElementById("board-rows");
      const pool = new Map();
      for (const [slug, m] of Object.entries(realm.media)) {
        if (m.board) pool.set(slug, kit.makeRow(rowsEl, slug, kit.bySlug.get(slug).name));
      }
      const rowFor = (e) => {
        const row = pool.get(e.slug);
        if (!row) throw new Error(`${e.slug} reaches the board but is not in the snapshot: run bun tools/video-snapshot.ts`);
        return row;
      };

      const board = document.getElementById("board");
      const year = document.getElementById("board-year");
      const era = document.getElementById("board-era");
      const header = [year, document.getElementById("board-caption")];
      const ranks = Array.from({ length: SLOTS }, (_, k) => document.getElementById(`board-rank-${k + 1}`));
      const eraTimes = ERAS.map((x) => timeAtFront(ax.yearToUnit(x.year)));

      const draw = (t) => {
        const f = frontAt(t);
        // Arrives with the front; gives the panel to the tally when the credit beat begins.
        const headerOut = ramp(t, film.credit.at - 0.2, 0.2, ease.in2);
        board.style.opacity = ramp(t, film.sweep0 - 0.4, 0.3, ease.expoOut).toFixed(3);
        year.textContent = ax.formatYear(yearAt(ax, f));
        for (const el of [...header, ...ranks]) {
          el.style.opacity = (1 - headerOut).toFixed(3);
          el.style.filter = `blur(${(6 * headerOut).toFixed(2)}px)`;
        }

        // The era: lands blurred to sharp when the front crosses its first year, leaves just before the next.
        let i = 0;
        while (i + 1 < ERAS.length && t >= eraTimes[i + 1]) i++;
        era.textContent = ERAS[i].name;
        const enter = ramp(t, eraTimes[i], 0.3, ease.expoOut);
        const leave = Math.max(i + 1 < ERAS.length ? ramp(t, eraTimes[i + 1] - 0.15, 0.15, ease.in2) : 0, headerOut);
        era.style.opacity = (enter * (1 - leave)).toFixed(3);
        era.style.filter = `blur(${(6 * (1 - enter) + 6 * leave).toFixed(2)}px)`;

        // Standings now, and everyone's rank summed over the two windows (off the board counts as 7).
        const rowsShown = 1 - ramp(t, film.credit.at, 0.4, ease.in2);
        const visible = new Set();
        if (rowsShown > 0) {
          const now = race.standings(t);
          const OFF = SLOTS + 2;
          const sums = new Map();
          for (let j = 0; j < STAY_SAMPLES; j++) {
            const sample = j === 0 ? now : race.standings(t - j * SAMPLE_STEP);
            const onBoard = new Set();
            sample.forEach((r, k) => {
              if (!sums.has(r.e.slug)) sums.set(r.e.slug, { e: r.e, place: 0, stay: 0, firstSeen: j });
              const entry = sums.get(r.e.slug);
              if (j < PLACE_SAMPLES) entry.place += k + 1;
              entry.stay += k + 1;
              onBoard.add(r.e.slug);
            });
            for (const [slug, entry] of sums) {
              if (onBoard.has(slug)) continue;
              if (j < PLACE_SAMPLES) entry.place += OFF;
              entry.stay += OFF;
            }
          }
          const leader = now.length > 0 ? now[0].total : 1;
          const current = new Map(now.map((r) => [r.e.slug, r]));
          const standing = new Map(now.map((r, k) => [r.e.slug, k + 1]));
          for (const { e, place, stay, firstSeen } of sums.values()) {
            // Samples before an entity was first seen in this window count as off the board.
            const rank = (place + Math.min(firstSeen, PLACE_SAMPLES) * OFF) / PLACE_SAMPLES;
            const op = clamp01(SLOTS + 1 - (stay + firstSeen * OFF) / STAY_SAMPLES);
            if (op <= 0) continue;
            const row = rowFor(e);
            const r = current.get(e.slug) ?? (([b, h]) => ({ b, h }))(race.levelAt(e, race.bucketAt(t)));
            row.el.style.transform = `translateY(${(kit.ROW_TOP + (rank - 1) * kit.PITCH).toFixed(1)}px)`;
            row.el.style.opacity = (op * rowsShown).toFixed(3);
            // In a pass, the row ranked higher now slides over the one it is passing.
            row.el.style.zIndex = String(SLOTS + 3 - (standing.get(e.slug) ?? SLOTS + 2));
            kit.setBar(row, r.b, r.h, leader, kit.BAR_RACE);
            row.shown = true;
            visible.add(e.slug);
          }
        }
        for (const [slug, row] of pool) {
          if (row.shown && !visible.has(slug)) {
            row.el.style.opacity = "0";
            row.shown = false;
          }
        }
      };

      await kit.ready();
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: film.duration, duration: film.duration, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines["race-board"] = tl;
    });
  </script>
</template>
