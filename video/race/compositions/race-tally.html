<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #tally {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="race-tally" data-width="1920" data-height="1080">
    <div id="tally" class="clip" data-start="0" data-duration="300" data-track-index="0">
      <div id="tally-year" class="panel-year"></div>
      <div id="tally-era" class="panel-era"></div>
      <div id="tally-caption" class="panel-caption"></div>
      <div id="tally-rank-1" class="board-rank" style="top: 380px">1</div>
      <div id="tally-rank-2" class="board-rank" style="top: 472px">2</div>
      <div id="tally-rank-3" class="board-rank" style="top: 564px">3</div>
      <div id="tally-rank-4" class="board-rank" style="top: 656px">4</div>
      <div id="tally-rank-5" class="board-rank" style="top: 748px">5</div>
      <div id="tally-rows" class="board-rows" data-layout-allow-overlap data-layout-allow-occlusion></div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(async () => {
      const River = window.River;
      const { FILMS, axis, ease, ramp } = River;
      const realm = window.REALM;
      const film = FILMS.race;
      const ax = axis(realm);
      const kit = window.RaceKit(realm);
      const SLOTS = River.board(realm, film).slots;
      const rowsEl = document.getElementById("tally-rows");

      // Share of an entity's own influence that is benefit: its curve's area, in years.
      const edges = Array.from({ length: ax.buckets + 1 }, (_, i) => ax.unitToYear(i / ax.buckets));
      const ownArea = (e) => {
        let b = 0;
        let h = 0;
        e.curve.benefit.forEach((v, k) => {
          const i = e.curve.from + k;
          const w = edges[i + 1] - edges[i];
          b += v * w;
          h += (e.curve.harm[k] ?? 0) * w;
        });
        return { b, h };
      };

      // ---- the credit beat: the hero's own influence, then what its consequences credit back ----
      const credit = River.creditRows(realm, film);
      const hero = credit.hero;
      const heroRank = 1 + realm.entities.filter((e) => e.total_magnitude > hero.total_magnitude).length;
      // Whole numbers that add up to the total shown (largest remainder).
      const totalShown = Math.round(hero.total_magnitude);
      const shownParts = credit.rows.map((r) => Math.floor(r.value));
      let short = totalShown - shownParts.reduce((a, b) => a + b, 0);
      const byRemainder = credit.rows.map((r, i) => [r.value - Math.floor(r.value), i]).sort((a, b) => b[0] - a[0]);
      for (let k = 0; short !== 0; k = (k + 1) % byRemainder.length) {
        const step = short > 0 ? 1 : -1;
        shownParts[byRemainder[short > 0 ? k : byRemainder.length - 1 - k][1]] += step;
        short -= step;
      }
      const creditMax = Math.max(...credit.rows.map((r) => r.value));
      const creditRows = credit.rows.map((r, k) => {
        const area = r.slugs
          .map((slug) => ownArea(kit.bySlug.get(slug)))
          .reduce((a, x) => ({ b: a.b + x.b, h: a.h + x.h }), { b: 0, h: 0 });
        const share = area.b / (area.b + area.h);
        const row = kit.makeRow(rowsEl, r.entity ? r.entity.slug : null, r.name);
        row.value.textContent = `${k === 0 ? "" : "+"}${shownParts[k].toLocaleString("en-US")}`;
        kit.setBar(row, r.value * share, r.value * (1 - share), creditMax, kit.BAR_TOTAL);
        return { at: r.at, row, shown: shownParts[k] };
      });

      // ---- all time: the top five by total influence, in the site's own numbers ----
      const allTime = [...realm.entities].sort((a, b) => b.total_magnitude - a.total_magnitude).slice(0, SLOTS);
      const allTimeRows = allTime.map((e) => {
        const row = kit.makeRow(rowsEl, e.slug, e.name);
        row.value.textContent = Math.round(e.total_magnitude).toLocaleString("en-US");
        const share = e.benefit_total / (e.benefit_total + e.harm_total);
        kit.setBar(row, e.total_magnitude * share, e.total_magnitude * (1 - share), allTime[0].total_magnitude, kit.BAR_TOTAL);
        return row;
      });

      // ---- the header for each part ----
      const headers = {
        credit: {
          year: hero.name,
          caption: "Own, plus credit from consequences",
          era: (t) => {
            // Starts at the hero's own influence; each consequence's credit counts in as its row lands.
            const tally = creditRows.reduce((sum, r, k) => sum + r.shown * (k === 0 ? 1 : ramp(t, r.at, 0.4, ease.inOut2)), 0);
            return `No. ${heroRank} of all time · ${Math.round(tally).toLocaleString("en-US")}`;
          },
        },
        allTime: {
          year: "All time",
          era: () => `${ax.formatYear(realm.timeline.start)} to ${realm.as_of_year}`,
          caption: "Every year added together",
        },
      };
      for (const p of Object.values(headers)) {
        for (const [text, font] of [
          [p.year, '700 96px "Inter"'],
          [p.era(film.duration), '400 34px "Inter"'],
          [p.caption, '400 28px "Inter"'],
        ]) {
          if (kit.widthOf(text, font) > 504) throw new Error(`"${text}" is wider than the panel`);
        }
      }

      const tally = document.getElementById("tally");
      const year = document.getElementById("tally-year");
      const era = document.getElementById("tally-era");
      const caption = document.getElementById("tally-caption");
      const ranks = Array.from({ length: SLOTS }, (_, k) => document.getElementById(`tally-rank-${k + 1}`));

      const draw = (t) => {
        tally.style.opacity = (ramp(t, film.credit.at - 0.05, 0.05, ease.in2) * (1 - ramp(t, film.dimAt, 0.4, ease.in2))).toFixed(3);
        const p = t < film.allTimeAt ? headers.credit : headers.allTime;
        year.textContent = p.year;
        era.textContent = p.era(t);
        caption.textContent = p.caption;
        // Each header lands blurred to sharp; the credit one gives way just before all time.
        const enter = ramp(t, t < film.allTimeAt ? film.credit.at : film.allTimeAt, 0.35, ease.expoOut);
        const leave = t < film.allTimeAt ? ramp(t, film.allTimeAt - 0.2, 0.2, ease.in2) : 0;
        for (const el of [year, era, caption]) {
          el.style.opacity = (enter * (1 - leave)).toFixed(3);
          el.style.filter = `blur(${(6 * (1 - enter) + 6 * leave).toFixed(2)}px)`;
        }
        const ranksShown = ramp(t, film.allTimeAt, 0.3, ease.expoOut);
        for (const el of ranks) el.style.opacity = ranksShown.toFixed(3);

        // The credit rows land one by one, each as its bands light on the river, then give way.
        const creditLeave = ramp(t, film.allTimeAt - 0.45, 0.35, ease.in2);
        creditRows.forEach((r, k) => {
          const rowEnter = ramp(t, r.at, 0.35, ease.expoOut);
          r.row.el.style.opacity = (rowEnter * (1 - creditLeave)).toFixed(3);
          r.row.el.style.transform = `translateY(${(kit.ROW_TOP + k * kit.PITCH + 14 * (1 - rowEnter)).toFixed(1)}px)`;
        });

        // All time: rows arrive from the top; the one lit on the river stays bright.
        const lit = film.ranksAt.map((at) => ramp(t, at, 0.45, ease.inOut2) * (1 - ramp(t, at + film.rankHold - 0.05, 0.35, ease.inOut2)));
        const anyLit = Math.max(0, ...lit);
        allTimeRows.forEach((row, k) => {
          const rowEnter = ramp(t, film.allTimeAt + 0.1 + 0.12 * k, 0.35, ease.expoOut);
          const own = k < lit.length ? lit[k] : 0;
          row.el.style.opacity = (rowEnter * (1 - 0.5 * Math.max(0, anyLit - own))).toFixed(3);
          row.el.style.transform = `translateY(${(kit.ROW_TOP + k * kit.PITCH + 14 * (1 - rowEnter)).toFixed(1)}px)`;
        });
      };

      await kit.ready();
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: film.duration, duration: film.duration, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines["race-tally"] = tl;
    });
  </script>
</template>
