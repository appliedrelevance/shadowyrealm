<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #card-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      font-family: "Inter", sans-serif;
    }
    /* The lower third under the river: why the name in it matters, in the site's own words. */
    #card {
      position: absolute;
      left: 96px;
      top: 888px;
      width: 1154px;
      height: 136px;
      opacity: 0;
    }
    #card-pics {
      position: absolute;
      left: 0;
      top: 0;
      width: 112px;
      height: 112px;
    }
    .card-pic {
      position: absolute;
      left: 0;
      top: 0;
      width: 112px;
      height: 112px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--color-line);
      background: var(--color-surface-2);
      color: var(--color-ink-muted);
    }
    .card-pic img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-pic svg {
      position: absolute;
      left: 25%;
      top: 25%;
      width: 50%;
      height: 50%;
    }
    #card-text {
      position: absolute;
      left: 136px;
      top: 0;
      width: 1018px;
    }
    #card-kicker {
      font-size: 28px;
      line-height: 34px;
      color: var(--color-ink);
      white-space: nowrap;
    }
    .card-name {
      font-weight: 700;
    }
    .card-reason {
      margin-left: 24px;
      font-weight: 400;
      color: var(--color-ink-2);
    }
    .card-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 10px;
      border-radius: 3px;
      vertical-align: 1px;
    }
    #card-body {
      margin-top: 4px;
      font-weight: 400;
      font-size: 28px;
      line-height: 34px;
      color: var(--color-ink-2);
    }
  </style>
  <div id="root" data-composition-id="race-card" data-width="1920" data-height="1080">
    <div id="card-stage" class="clip" data-start="0" data-duration="300" data-track-index="0">
      <div id="card">
        <div id="card-pics"></div>
        <div id="card-text">
          <div id="card-kicker"></div>
          <div id="card-body"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(async () => {
      const River = window.River;
      const { FILMS, ease, ramp } = River;
      const realm = window.REALM;
      const film = FILMS.race;
      const bySlug = new Map(realm.entities.map((e) => [e.slug, e]));
      const kit = window.RaceKit(realm);

      // Each card holds for its words: 0.5 s plus 0.3 s a word. Too many words for the time or the
      // three lines: the description goes, the type size never does.
      const words = (text) => text.split(/\s+/).filter(Boolean).length;
      const readTime = (n) => 0.5 + 0.3 * n;
      const BODY_LINES = 3;
      const cardEl = document.getElementById("card");
      const picsEl = document.getElementById("card-pics");
      const kickerEl = document.getElementById("card-kicker");
      const bodyEl = document.getElementById("card-body");
      const escape = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const kickerHtml = (card) =>
        `<span class="card-name">${escape(card.title)}</span>` +
        card.reasons
          .map((r) => `<span class="card-reason"><span class="card-swatch" style="background: var(--color-${r.side})"></span>${escape(r.text)}</span>`)
          .join("");
      const fits = (card) => {
        kickerEl.innerHTML = kickerHtml(card);
        if (kickerEl.scrollWidth > 1018) throw new Error(`The card for ${card.slug} is wider than the lower third`);
        bodyEl.textContent = card.body ?? "";
        return bodyEl.scrollHeight <= BODY_LINES * 34;
      };

      // A card for each entity the first time it leads the board: the two largest areas of its own
      // profile, and its description from the site.
      const cards = [];
      const leads = River.board(realm, film).firstLeads();
      leads.forEach((lead, i) => {
        const e = lead.e;
        const m = kit.mediaOf(e.slug);
        if (!m.reason) throw new Error(`The snapshot has no reason for leader ${e.slug}: run bun tools/video-snapshot.ts`);
        const at = lead.at + 0.6;
        const next = i + 1 < leads.length ? leads[i + 1].at + 0.6 : film.credit.at;
        const room = Math.min(12, next - 0.4 - at);
        const card = { slug: e.slug, title: e.name, reasons: m.reason, body: e.description, at };
        const kickerWords = words(card.title) + card.reasons.reduce((n, r) => n + words(r.text), 0);
        if (room < readTime(kickerWords + words(card.body)) || !fits(card)) card.body = null;
        const need = readTime(kickerWords + (card.body ? words(card.body) : 0));
        if (room < need) return;
        card.until = at + Math.min(room, Math.max(need + 1.5, 5));
        cards.push(card);
      });

      // And one in the credit beat: the hero's link to its largest consequence, in the site's words.
      const credit = River.creditRows(realm, film);
      const heroCard = {
        slug: credit.hero.slug,
        title: `${credit.link.label} ${bySlug.get(credit.link.target).name}`,
        reasons: [],
        body: credit.link.description,
        at: credit.rows[1].at + 0.2,
        until: film.credit.end - 0.2,
      };
      if (!fits(heroCard)) throw new Error(`The link sentence for ${heroCard.slug} runs past ${BODY_LINES} lines`);
      if (heroCard.until - heroCard.at < readTime(words(heroCard.title) + words(heroCard.body))) {
        throw new Error("The credit card is not on screen long enough to read");
      }
      cards.push(heroCard);
      kickerEl.innerHTML = "";
      bodyEl.textContent = "";

      const pics = new Map();
      for (const card of cards) {
        if (pics.has(card.slug)) continue;
        const box = kit.picture(card.slug, "card-pic");
        box.style.display = "none";
        picsEl.appendChild(box);
        pics.set(card.slug, box);
      }

      let shown = null;
      const draw = (t) => {
        const card = cards.find((c) => t >= c.at - 0.05 && t < c.until + 0.25) ?? null;
        if (card !== shown) {
          if (shown) pics.get(shown.slug).style.display = "none";
          if (card) {
            pics.get(card.slug).style.display = "block";
            kickerEl.innerHTML = kickerHtml(card);
            bodyEl.textContent = card.body ?? "";
          }
          shown = card;
        }
        if (!card) {
          cardEl.style.opacity = "0";
          return;
        }
        // Lands blurred to sharp, holds still, leaves.
        const enter = ramp(t, card.at, 0.3, ease.expoOut);
        const leave = ramp(t, card.until, 0.2, ease.in2);
        cardEl.style.opacity = (enter * (1 - leave) * (1 - ramp(t, film.dimAt, 0.4, ease.in2))).toFixed(3);
        cardEl.style.filter = `blur(${(6 * (1 - enter) + 6 * leave).toFixed(2)}px)`;
      };

      await kit.ready();
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: film.duration, duration: film.duration, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines["race-card"] = tl;
    });
  </script>
</template>
