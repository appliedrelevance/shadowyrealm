<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #river-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      font-family: "Inter", sans-serif;
    }
    #river-svg {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
  <div id="root" data-composition-id="river" data-width="1080" data-height="1920">
    <div id="river-stage" class="clip" data-start="0" data-duration="120" data-track-index="0">
      <svg id="river-svg" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
    </div>
  </div>
  <script>
    document.fonts.ready.then(() => {
      const film = window.River.FILMS.countdown;
      const draw = window.River.mount({ svg: document.getElementById("river-svg"), realm: window.REALM, film });
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: film.duration, duration: film.duration, ease: "none", onUpdate: () => draw(state.t) }, 0);
      // The hook moves: a slow push into the lit river from the ruler's baseline, settling back as
      // the ten go dark, so the first and the last frame are the same frame.
      const svg = document.getElementById("river-svg");
      const { dark, darkDur } = film.light;
      tl.fromTo(svg, { scale: 1 }, { scale: 1.03, transformOrigin: "540px 900px", duration: dark, ease: "none" }, 0);
      tl.to(svg, { scale: 1, transformOrigin: "540px 900px", duration: darkDur, ease: "power2.inOut" }, dark);
      draw(0);
      window.__timelines["river"] = tl;
    });
  </script>
</template>
