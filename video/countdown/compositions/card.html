<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #card-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      font-family: "Inter", sans-serif;
    }
    /* The card above the ruler, x 72 to 1008, y 192 down to the ruler's labels (baseline y 900):
       the rank and the picture on one row, then the name and the meta line, and under them why,
       the line of the entity's narrative, one big word at a time. */
    #card {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 840px;
    }
    #card-rank {
      position: absolute;
      left: 72px;
      top: 192px;
      font-weight: 900;
      font-size: 160px;
      line-height: 160px;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--color-ink);
      white-space: nowrap;
      transform-origin: 0 136px;
    }
    #card-pics {
      position: absolute;
      left: 848px;
      top: 192px;
      width: 160px;
      height: 160px;
    }
    .card-pic {
      position: absolute;
      left: 0;
      top: 0;
      width: 160px;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--color-line);
      background: var(--color-surface-2);
      color: var(--color-ink-muted);
    }
    .card-pic img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-pic svg {
      position: absolute;
      left: 25%;
      top: 25%;
      width: 50%;
      height: 50%;
    }
    #card-text {
      position: absolute;
      left: 72px;
      top: 376px;
      width: 936px;
    }
    #card-name {
      font-weight: 700;
      font-size: 64px;
      line-height: 72px;
      letter-spacing: -0.01em;
      color: var(--color-ink);
    }
    #card-meta {
      margin-top: 14px;
      font-weight: 400;
      font-size: 38px;
      line-height: 46px;
      color: var(--color-ink-muted);
      white-space: nowrap;
    }
    #card-share {
      color: var(--color-harm);
    }
    #card-share.side-benefit {
      color: var(--color-benefit);
    }
    /* One word at a time, always in the same place: left at x 72, its box from y 640. */
    #card-word {
      position: absolute;
      left: 72px;
      top: 640px;
      font-weight: 900;
      font-size: 120px;
      line-height: 132px;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      white-space: nowrap;
      transform-origin: 0 66px;
    }
    #card-word.number {
      color: var(--color-harm);
    }
    #card-word.number.side-benefit {
      color: var(--color-benefit);
    }
  </style>
  <div id="root" data-composition-id="card" data-width="1080" data-height="1920">
    <!-- data-hold: the rank, name and meta hold still while the words play under them. -->
    <div id="card-stage" class="clip" data-start="0" data-duration="90.666" data-track-index="0" data-hold>
      <div id="card">
        <div id="card-rank"></div>
        <div id="card-pics"></div>
        <div id="card-text">
          <div id="card-name"></div>
          <div id="card-meta"><span id="card-kind"></span> · <span id="card-share"></span></div>
        </div>
        <div id="card-word"></div>
      </div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(async () => {
      const River = window.River;
      const { ease, ramp } = River;
      const realm = window.REALM;
      const film = River.FILMS.countdown;
      const plan = River.countdownPlan(realm, film);
      const kit = window.RaceKit(realm);

      const cardEl = document.getElementById("card");
      const rankEl = document.getElementById("card-rank");
      const picsEl = document.getElementById("card-pics");
      const nameEl = document.getElementById("card-name");
      const kindEl = document.getElementById("card-kind");
      const shareEl = document.getElementById("card-share");
      const wordEl = document.getElementById("card-word");
      const textEl = document.getElementById("card-text");
      shareEl.className = `side-${plan.ranking.side}`;

      // Every card's words fit: a name in two lines, the meta line in one, the meta's foot 24 px
      // above the words' box (y 640), and every word of why on one line. Words are cut, never type.
      // Measured in a probe on the page's body, which is laid out before the scene is shown, in the
      // face and sizes the card draws with, 900 px wide: the Studio preview and the headless
      // renderer break lines a few pixels apart, so the probe measures with 36 px to spare.
      const MEASURE = 900;
      const fill = (entry) => {
        rankEl.textContent = `#${entry.rank}`;
        nameEl.textContent = entry.name;
        kindEl.textContent = entry.kindSpan;
        shareEl.textContent = entry.share;
      };
      const probe = document.createElement("div");
      probe.setAttribute("data-layout-ignore", "");
      probe.style.cssText = "position: absolute; left: -10000px; top: 0; width: 936px; visibility: hidden;";
      document.body.appendChild(probe);
      const measure = (text, css, nowrap = false) => {
        probe.style.whiteSpace = nowrap ? "nowrap" : "normal";
        probe.style.width = nowrap ? "auto" : `${MEASURE}px`;
        probe.style.font = css.font;
        probe.style.lineHeight = css.lineHeight;
        probe.style.letterSpacing = css.letterSpacing ?? "normal";
        probe.textContent = text;
        const box = probe.getBoundingClientRect();
        return { width: box.width, lines: Math.round(box.height / parseFloat(css.lineHeight)) };
      };
      const NAME = { font: '700 64px "Inter"', lineHeight: "72px", letterSpacing: "-0.64px" };
      const META = { font: '400 38px "Inter"', lineHeight: "46px" };
      const WORD = { font: '900 120px "Inter"', lineHeight: "132px", letterSpacing: "-2.4px" };
      const WORD_TOP = 640;
      for (const entry of plan.entries) {
        const name = measure(entry.name, NAME);
        const meta = measure(`${entry.kindSpan} · ${entry.share}`, META, true);
        if (name.lines > 2) throw new Error(`${entry.name} runs to ${name.lines} lines; the card has two`);
        if (meta.width > MEASURE) throw new Error(`The meta line of ${entry.name} is ${Math.ceil(meta.width)} px wide; it may be ${MEASURE}`);
        const metaFoot = 376 + name.lines * 72 + 14 + 46;
        if (metaFoot > WORD_TOP - 24) throw new Error(`The meta line of ${entry.name} ends at y ${metaFoot}; the words start at ${WORD_TOP}`);
        for (const c of entry.captions) {
          const word = measure(c.text, WORD, true);
          if (word.width > MEASURE) throw new Error(`"${c.text}" in ${entry.name}'s line is ${Math.ceil(word.width)} px wide; it may be ${MEASURE}`);
        }
      }
      probe.remove();

      const pics = new Map();
      for (const entry of plan.entries) {
        const box = kit.picture(entry.slug, "card-pic");
        box.style.display = "none";
        picsEl.appendChild(box);
        pics.set(entry.slug, box);
      }

      // One card at a time: the rank lands on the card's beat (0.35 s from 1.12 and blurred), the
      // rest 0.12 s after it (0.3 s, blurred to sharp), and all of it leaves 0.2 s, ending 0.15 s
      // before the next card's beat. Each word of why cuts in on its eighth note, 1.18 times its
      // size and settling in 0.14 s, and stays until the next word; the last stays until the card
      // leaves.
      wordEl.classList.toggle("side-benefit", plan.ranking.side === "benefit");
      let shown = null;
      let shownWord = null;
      const draw = (t) => {
        const entry = plan.entries.find((e) => t >= e.at - 0.02 && t < e.until - 0.15) ?? null;
        if (entry !== shown) {
          if (shown) pics.get(shown.slug).style.display = "none";
          if (entry) {
            fill(entry);
            pics.get(entry.slug).style.display = "block";
          }
          shown = entry;
        }
        if (!entry) {
          cardEl.style.opacity = "0";
          return;
        }
        const leave = ramp(t, entry.until - 0.35, 0.2, ease.in2);
        const rankIn = ramp(t, entry.at, 0.35, ease.expoOut);
        const restIn = ramp(t, entry.at + 0.12, 0.3, ease.expoOut);
        cardEl.style.opacity = (1 - leave).toFixed(3);
        cardEl.style.filter = leave > 0 ? `blur(${(6 * leave).toFixed(2)}px)` : "none";
        rankEl.style.opacity = rankIn.toFixed(3);
        rankEl.style.transform = `scale(${(1.12 - 0.12 * rankIn).toFixed(4)})`;
        rankEl.style.filter = `blur(${(6 * (1 - rankIn)).toFixed(2)}px)`;
        for (const el of [picsEl, textEl]) {
          el.style.opacity = restIn.toFixed(3);
          el.style.filter = `blur(${(6 * (1 - restIn)).toFixed(2)}px)`;
        }
        let word = null;
        for (const c of entry.captions) if (t >= c.at - 1e-6) word = c;
        if (word !== shownWord) {
          wordEl.textContent = word ? word.text : "";
          wordEl.classList.toggle("number", Boolean(word?.number));
          shownWord = word;
        }
        if (word) {
          const pop = ramp(t, word.at, 0.14, ease.expoOut);
          wordEl.style.opacity = "1";
          wordEl.style.transform = `scale(${(1.18 - 0.18 * pop).toFixed(4)})`;
        } else {
          wordEl.style.opacity = "0";
        }
      };

      await kit.ready();
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: film.duration, duration: film.duration, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines["card"] = tl;
    });
  </script>
</template>
