<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    /* The hook's words, over the ten lit bands: on frame 0 (the feed shows it first), gone as the
       ten go dark, and back as they relight in the outro, so the last frame is the first. Inside
       y 168 to 1330, the band the app leaves clear. */
    #titles {
      position: absolute;
      inset: 0;
      font-family: "Inter", sans-serif;
      color: var(--color-ink);
    }
    #title-top {
      position: absolute;
      left: 72px;
      top: 196px;
      margin: 0;
      font-weight: 700;
      font-size: 132px;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    #title-method {
      position: absolute;
      left: 72px;
      top: 628px;
      margin: 0;
      font-weight: 400;
      font-size: 36px;
      line-height: 1;
      color: var(--color-ink-muted);
      white-space: nowrap;
    }
    .title-line {
      display: block;
    }
  </style>
  <div id="root" data-composition-id="titles" data-width="1080" data-height="1920">
    <div id="titles" class="clip" data-start="0" data-duration="120" data-track-index="0">
      <h1 id="title-top">
        <span class="title-line">The 10 worst</span>
        <span class="title-line">things in</span>
        <span class="title-line">history</span>
      </h1>
      <p id="title-method">Ranked by benefit minus harm · shadowyrealm.com</p>
    </div>
  </div>
  <script>
    document.fonts.ready.then(() => {
      const River = window.River;
      const film = River.FILMS.countdown;
      const plan = River.countdownPlan(window.REALM, film);
      // The words are the ranking's, so one build serves all five; measured in the face they
      // render in.
      const lines = document.querySelectorAll("#title-top .title-line");
      if (lines.length !== plan.ranking.title.length) throw new Error("The title has a line per line of the ranking's title");
      plan.ranking.title.forEach((text, i) => (lines[i].textContent = text));
      document.getElementById("title-method").textContent = `${plan.ranking.method} · shadowyrealm.com`;
      // Each line's width, in a probe on the page's body (laid out before the scene is shown).
      const probe = document.createElement("div");
      probe.setAttribute("data-layout-ignore", "");
      probe.style.cssText = "position: absolute; left: -10000px; top: 0; visibility: hidden; white-space: nowrap;";
      document.body.appendChild(probe);
      const widthOf = (text, font, letterSpacing = "normal") => {
        probe.style.font = font;
        probe.style.letterSpacing = letterSpacing;
        probe.textContent = text;
        return probe.getBoundingClientRect().width;
      };
      const widths = [
        ...plan.ranking.title.map((text) => [text, widthOf(text, '700 132px "Inter"', "-2.64px")]),
        [`${plan.ranking.method} · shadowyrealm.com`, widthOf(`${plan.ranking.method} · shadowyrealm.com`, '400 36px "Inter"')],
      ];
      probe.remove();
      for (const [text, w] of widths) if (w > 936) throw new Error(`"${text}" is ${Math.ceil(w)} px wide; the frame has 936`);

      const words = ["#title-top", "#title-method"];
      const tl = gsap.timeline({ paused: true });
      // Leave as the ten go dark (0.3 s, power2.in); return as they relight (0.5 s, expo.out).
      tl.fromTo(words, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.8);
      tl.fromTo(
        words,
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        plan.outroAt + 0.233,
      );
      window.__timelines["titles"] = tl;
    });
  </script>
</template>
