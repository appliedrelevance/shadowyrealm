<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- The frozen realm: tools/video-snapshot.ts writes it from /api/realm. -->
    <script src="assets/realm-data.js"></script>
    <script src="assets/river.js"></script>
    <link rel="stylesheet" href="assets/river.css" />
    <!-- Pictures, decoded before the card registers its timeline (shared with the race). -->
    <script src="assets/race-kit.js"></script>
    <style>
      /* The site's own tokens, from src/styles/global.css. */
      :root {
        --color-surface: #181822;
        --color-surface-2: #262636;
        --color-ink: #f8fafc;
        --color-ink-2: #e2e8f0;
        --color-ink-muted: #94a3b8;
        --color-line: #333350;
        --color-line-strong: #4a4a70;
        --color-benefit: #3e9ad6;
        --color-harm: #d9534f;
        --font-sans: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-surface);
        font-family: var(--font-sans);
      }
      #root {
        width: 100%;
        height: 100%;
        background: var(--color-surface);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="120"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="river"
        data-composition-id="river"
        data-composition-src="compositions/river.html"
        data-start="0"
        data-duration="120"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="card"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
        data-start="0"
        data-duration="120"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="120"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <!-- Our own score, the SoundCraft session countdown-score.scraft: the race's themes in D minor at
           90 bpm, a stroke on every card's beat, the crest soft at frame 0 so the loop's end runs
           into its start (video/music/README.md). No fades. -->
      <audio
        id="bed"
        class="clip"
        src="assets/music/countdown-score.m4a"
        data-start="0"
        data-duration="120"
        data-volume="1"
        data-track-index="9"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
